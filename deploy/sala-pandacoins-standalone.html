  spinStop:function(){ try{ if(_spinRamp){cancelAnimationFrame(_spinRamp);_spinRamp=null;} if(spinAudio){ spinAudio.pause(); spinAudio.currentTime=0; spinAudio.playbackRate=1.0; spinAudio.volume=0.55*(exiVol/100); } }catch(e){} }};
window.EXISFX=SFX; // el resultado (win/lose) lo dispara el script principal al frenar la rueda

// (Sin música de ambiente: el mp3 de fondo se probó y se descartó — solo suenan los
//  efectos del juego: fichas, giro, bola y victoria/derrota.)
function startAmbient(){}
// (El tono sintetizado al pulsar LISTO se quitó: se solapaba con el MP3 del giro → sonaban 2 audios a la vez.)
document.addEventListener('click',function(){AC();startAmbient();});
document.addEventListener('keydown',function(){AC();startAmbient();},false);
// (el antiguo watchStatus que adivinaba win/lose por el texto del estado se eliminó: hacía sonar
//  "perder" en cada giro por la palabra "acompañe" y nunca el de victoria. Ahora se controla en JS.)
var volWrap=el('div','display:flex; align-items:center; gap:6px;');
var mb=el('button','padding:6px 9px; border-radius:20px; border:1px solid rgba(187,141,80,.4); background:rgba(30,17,7,.88); color:var(--oro-claro); font-size:13px; cursor:pointer;');mb.type='button';
var vs=document.createElement('input'); vs.type='range'; vs.min='0'; vs.max='100'; vs.step='1'; vs.value=String(exiVol); vs.setAttribute('aria-label','Volumen'); vs.style.cssText='width:70px; accent-color:var(--oro-claro); cursor:pointer;';
function lbl(){mb.textContent=exiVol===0?'🔇':'🔊';}
lbl();
mb.onclick=function(){ if(exiVol>0){ setVolume(0); } else { setVolume(_volBeforeMute||70); AC(); startAmbient(); } lbl(); vs.value=String(exiVol); if(exiVol===0){ try{ if(spinAudio) spinAudio.pause(); }catch(e){} } };
vs.oninput=function(){ setVolume(Number(vs.value)); lbl(); if(exiVol>0){ AC(); startAmbient(); } };
volWrap.appendChild(mb); volWrap.appendChild(vs);
bar.insertBefore(volWrap,bar.firstChild);
})();
</script>

<!-- ███ Banner de BIENVENIDA · se muestra UNA sola vez por navegador (localStorage
     exi_welcome_seen), a cualquiera que entre a la sala (con o sin sesión). Cortinas
     doradas que se abren + lluvia de monedas + título con brillo. Respeta
     prefers-reduced-motion (la regla global de arriba ya acelera todas las animaciones
     a ~0 para quien lo pida). ███ -->
<script>
(function(){
  try{ if(localStorage.getItem('exi_welcome_seen')==='1') return; }catch(e){ return; }

  function buildCoins(container, n){
    var html='';
    for(var i=0;i<n;i++){
      var left=(Math.random()*100).toFixed(1);
      var delay=(Math.random()*2.8).toFixed(2);
      var dur=(4.5+Math.random()*3.2).toFixed(2);
      var size=(16+Math.random()*22).toFixed(0);
      html+='<img src="assets/coin_3.png" alt="" style="position:absolute; top:-12%; left:'+left+'%; width:'+size+'px; height:'+size+'px; opacity:0; animation:exiCoinFall '+dur+'s '+delay+'s linear infinite; filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));">';
    }
    container.innerHTML=html;
  }

  function mount(){
    if(!document.body){ setTimeout(mount,80); return; }
    var ov=document.createElement('div');
    ov.id='exi-welcome';
    ov.setAttribute('role','dialog');
    ov.setAttribute('aria-label','Bienvenida a la Ruleta Exilium Guild');
    ov.style.cssText='position:fixed; inset:0; z-index:999990; display:flex; align-items:center; justify-content:center; overflow:hidden; background:radial-gradient(ellipse at 50% 40%, rgba(60,38,14,.55), rgba(5,3,2,.96) 72%); animation:exiWelcomeFadeIn .5s ease both; cursor:pointer;';
    ov.innerHTML=
      '<div aria-hidden="true" style="position:absolute; top:0; left:0; width:52%; height:100%; background:linear-gradient(90deg,#0e0904 0%,#3a2410 55%,#a06a28 92%,#e3d5b7 100%); box-shadow:14px 0 50px rgba(0,0,0,.65); animation:exiWelcomeCurtainL 1.15s .85s cubic-bezier(.7,0,.3,1) both; z-index:5;"></div>'+
      '<div aria-hidden="true" style="position:absolute; top:0; right:0; width:52%; height:100%; background:linear-gradient(270deg,#0e0904 0%,#3a2410 55%,#a06a28 92%,#e3d5b7 100%); box-shadow:-14px 0 50px rgba(0,0,0,.65); animation:exiWelcomeCurtainR 1.15s .85s cubic-bezier(.7,0,.3,1) both; z-index:5;"></div>'+
      '<div id="exi-welcome-coins" aria-hidden="true" style="position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:2;"></div>'+
      '<div style="position:relative; z-index:3; text-align:center; padding:24px; max-width:620px;">'+
        '<div aria-hidden="true" style="font-size:clamp(34px,6vw,52px); margin-bottom:8px; filter:drop-shadow(0 6px 16px rgba(0,0,0,.6)); animation:exiWelcomeSubIn .7s 1.85s ease both;">🐉 🎰 🐉</div>'+
        '<h1 style="font-family:\'Cinzel Decorative\',serif; font-weight:900; color:var(--oro-brillo); text-transform:uppercase; font-size:clamp(21px,4vw,40px); line-height:1.25; margin:0 0 12px; animation:exiWelcomeTitleIn 1s 1.95s cubic-bezier(.2,.7,.3,1) both, exiWelcomeGlow 2.6s 2.95s ease-in-out infinite;">¡Bienvenido a la<br>Ruleta Exilium Guild!</h1>'+
        '<p style="font-family:\'Inter\',sans-serif; color:var(--texto); font-size:clamp(13.5px,1.6vw,16px); line-height:1.6; margin:0 0 26px; opacity:.92; animation:exiWelcomeSubIn .7s 2.25s ease both;">La fortuna favorece a la guild. Sentate a la mesa, apostá tus PandaCoins y que gire la rueda.</p>'+
        '<button id="exi-welcome-cta" type="button" style="animation:exiWelcomeSubIn .7s 2.5s ease both; padding:14px 38px; border-radius:14px; border:2px solid var(--oro-brillo); background:linear-gradient(180deg,var(--oro-claro),var(--oro-oscuro)); color:#2a1608; font-family:\'Inter\',sans-serif; font-weight:800; font-size:14.5px; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; box-shadow:0 14px 34px -10px rgba(187,141,80,.7);">🎲 ¡A jugar!</button>'+
      '</div>';
    document.body.appendChild(ov);
    buildCoins(ov.querySelector('#exi-welcome-coins'), 16);

    var dismissed=false;
    function dismiss(){
      if(dismissed) return; dismissed=true;
      try{ localStorage.setItem('exi_welcome_seen','1'); }catch(e){}
      ov.style.transition='opacity .4s ease';
      ov.style.opacity='0';
      setTimeout(function(){ ov.remove(); }, 420);
    }
    ov.querySelector('#exi-welcome-cta').addEventListener('click', function(e){ e.stopPropagation(); dismiss(); });
    ov.addEventListener('click', dismiss);
    setTimeout(dismiss, 7000); // auto-cierre si nadie interactúa
  }
  mount();
})();
</script>

</body>
