

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala de PandaCoins — Ruleta Exilium Guild</title>
<link rel="icon" type="image/png" href="assets/icono.png">
<link rel="apple-touch-icon" href="assets/icono.png">
<link rel="prefetch" href="assets/celebration-nuevo.mp4" as="video" type="video/mp4">
<link rel="preload" href="assets/audio/giro-ruleta.mp3" as="audio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cinzel+Decorative:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ── Tokens del tema "bronce y pergamino" (a juego con Nuevo-fondo.png: arco dorado,
       estatuas de dragón en bronce, mármol oscuro y fuego). Solo COLOR: nada de layout. ── */
  :root{
    /* Superficies — sepia cálido, nunca negro puro */
    --panel: rgba(30, 17, 7, 0.78);
    --panel-solido: #1e1107;
    --panel-blur: 10px;
    /* Metal / oro — tomado de las estatuas del fondo */
    --oro-brillo: #e3d5b7;   /* highlight pergamino */
    --oro-claro: #d9a75a;
    --oro-medio: #bb8d50;
    --oro-oscuro: #a06a28;
    --oro-sombra: #7b4d25;
    /* Texto — crema, no blanco puro */
    --texto: #ead9b8;
    --texto-sec: #a08558;
    /* Acentos */
    --fuego: #d66d0a;        /* solo hover/activo/glow */
    --rojo: #8e2318;         /* carmesí quemado (ruleta, badges, Tienda) */
    --rojo-claro: #a32b1e;
    --verdin: #6f8f84;       /* pátina teal (selección, "en línea") */
    --negro-casilla: #1a0f08;
    /* Ajuste fino de #exi-wheel sobre el fondo (Nuevo-fondo.png): valores de escritorio.
       Se reducen en los breakpoints angostos/bajos para que la ruleta agrandada no se
       corte contra los bordes ni tape los asientos — ver overrides más abajo. */
    --exi-wheel-dx: 25px;
    --exi-wheel-dy: -30px;
    --exi-wheel-scale: 1.45;
  }
  /* Panel translúcido con borde de "metal" (degradado vertical brillo→sombra). Se aplica por
     clase ENCIMA de los estilos inline existentes (por eso los !important): el ancho y estilo
     del borde de cada elemento se conservan; solo cambian el relleno y el color del trazo. */
  .exi-panel{
    background:linear-gradient(var(--panel),var(--panel)) padding-box,
               linear-gradient(180deg,var(--oro-brillo),var(--oro-medio) 34%,var(--oro-sombra)) border-box !important;
    border-color:transparent !important;
    backdrop-filter:blur(var(--panel-blur));
    -webkit-backdrop-filter:blur(var(--panel-blur));
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#140b05; }
  /* Barra de scroll de la ventana en tema oscuro (evita la franja blanca al hacer scroll). */
  html{ scrollbar-color:var(--oro-sombra) #140b05; scrollbar-width:thin; }
  html::-webkit-scrollbar{ width:11px; height:11px; }
  html::-webkit-scrollbar-thumb{ background:rgba(187,141,80,.45); border-radius:7px; border:2px solid #140b05; }
  html::-webkit-scrollbar-track{ background:#140b05; }
  @keyframes exiFloat{ 0%,100%{ transform:translateY(-50%) rotate(-2deg); } 50%{ transform:translateY(calc(-50% - 14px)) rotate(2deg); } }
  @keyframes exiFloatR{ 0%,100%{ transform:translateY(-50%) scaleX(-1) rotate(2deg); } 50%{ transform:translateY(calc(-50% - 14px)) scaleX(-1) rotate(-2deg); } }
  @keyframes exiGlow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  @keyframes exiPop{ 0%{ transform:translate(-50%,8px) scale(.9); opacity:0; } 60%{ transform:translate(-50%,0) scale(1.04); } 100%{ transform:translate(-50%,0) scale(1); opacity:1; } }
  @keyframes exiBadge{ 0%{ transform:scale(.3); opacity:0; } 55%{ transform:scale(1.18); } 100%{ transform:scale(1); opacity:1; } }
  /* Feedback de cambio de saldo: destello al ganar (verde) o gastar (rojo) */
  @keyframes exiBalUp{ 0%{ transform:scale(1); } 32%{ transform:scale(1.16); color:#9fc7b2; text-shadow:0 0 14px rgba(159,199,178,.7); } 100%{ transform:scale(1); } }
  @keyframes exiBalDown{ 0%{ transform:scale(1); } 32%{ transform:scale(.92); color:#e88a84; } 100%{ transform:scale(1); } }
  /* Banner de bienvenida (primera visita): cortinas doradas que se abren + lluvia de monedas. */
  @keyframes exiWelcomeFadeIn{ 0%{ opacity:0; } 100%{ opacity:1; } }
  @keyframes exiWelcomeCurtainL{ 0%{ transform:translateX(0); } 100%{ transform:translateX(-102%); } }
  @keyframes exiWelcomeCurtainR{ 0%{ transform:translateX(0); } 100%{ transform:translateX(102%); } }
  @keyframes exiWelcomeTitleIn{ 0%{ transform:scale(.7); opacity:0; letter-spacing:.5em; } 65%{ transform:scale(1.05); opacity:1; } 100%{ transform:scale(1); opacity:1; letter-spacing:.01em; } }
  @keyframes exiWelcomeSubIn{ 0%{ opacity:0; transform:translateY(12px); } 100%{ opacity:1; transform:translateY(0); } }
  @keyframes exiWelcomeGlow{ 0%,100%{ text-shadow:0 0 18px rgba(217,167,90,.65), 0 0 40px rgba(217,167,90,.35); } 50%{ text-shadow:0 0 28px rgba(217,167,90,.95), 0 0 62px rgba(217,167,90,.6); } }
  @keyframes exiCoinFall{ 0%{ transform:translateY(-12vh) rotate(0deg); opacity:0; } 8%{ opacity:1; } 92%{ opacity:.9; } 100%{ transform:translateY(112vh) rotate(760deg); opacity:0; } }
  .exi-bal-up{ display:inline-block; animation:exiBalUp .6s ease; }
  .exi-bal-down{ display:inline-block; animation:exiBalDown .5s ease; }
  .exi-scroll::-webkit-scrollbar{ width:5px; }
  .exi-scroll::-webkit-scrollbar-thumb{ background:rgba(187,141,80,.4); border-radius:6px; }
  .exi-scroll::-webkit-scrollbar-track{ background:transparent; }
  [data-bet-key]{ transition:box-shadow .12s ease,filter .12s ease,transform .12s ease,border-color .12s ease; }
  [data-bet-key]:hover{ border-color:var(--oro-claro)!important; }
  [data-bet-key].exi-hv-self{ box-shadow:0 0 0 2px var(--oro-claro),0 0 26px rgba(187,141,80,.9)!important; transform:translateY(-3px) scale(1.08)!important; filter:brightness(1.4) saturate(1.15)!important; z-index:20!important; position:relative!important; }
  [data-bet-key].exi-hv-rel{ box-shadow:inset 0 0 0 2px rgba(187,141,80,.65),0 0 16px rgba(187,141,80,.5)!important; filter:brightness(1.22)!important; z-index:8!important; position:relative!important; }
  /* Estado de seleccion: casilla con apuesta activa -> anillo dorado persistente (el hover, con !important, manda por encima) */
  [data-bet-key].exi-has-bet{ box-shadow:inset 0 0 0 2px var(--oro-claro), 0 0 10px rgba(187,141,80,.45); }
  .exi-act{ transition:all .15s ease; }
  .exi-act:hover{ border-color:var(--oro-claro)!important; background:rgba(187,141,80,.2)!important; color:var(--oro-brillo)!important; transform:translateY(-2px); box-shadow:0 4px 14px rgba(187,141,80,.45); }
  .exi-act-clear:hover{ border-color:#cf6a64!important; background:rgba(142,35,24,.24)!important; color:#ff9a93!important; box-shadow:0 4px 14px rgba(207,106,100,.45); }
  /* ── Sistema de botones: primary (CTA dorado) / secondary (pill perfilada) / ghost (.exi-act) / danger ── */
  .exi-btn-primary{ font-family:'Inter',sans-serif; font-weight:800; letter-spacing:.04em; border-radius:11px; border:1px solid rgba(187,141,80,.5); background:linear-gradient(180deg,var(--oro-claro),var(--oro-oscuro)); color:#2a1608; box-shadow:0 10px 26px -8px rgba(160,106,40,.55), inset 0 1px 0 var(--oro-brillo); cursor:pointer; }
  /* Hover/active del CTA dorado: glow sutil de fuego (--fuego), el único sitio donde entra el naranja. */
  .exi-btn-primary:not(:disabled):hover, .exi-btn-primary:not(:disabled):active{ box-shadow:0 0 12px rgba(214,109,10,.45), 0 10px 26px -8px rgba(160,106,40,.55), inset 0 1px 0 var(--oro-brillo); }
  .exi-btn-secondary{ font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.02em; border-radius:20px; border:1px solid rgba(187,141,80,.4); background:rgba(30,17,7,.88); color:var(--oro-claro); cursor:pointer; }
  .exi-btn-secondary:hover{ border-color:rgba(187,141,80,.72)!important; background:rgba(32,22,15,.95)!important; }
  .exi-btn-danger{ font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.02em; border-radius:9px; border:1px solid rgba(142,35,24,.45); background:transparent; color:#cf6a64; cursor:pointer; }
  .exi-btn-danger:hover{ border-color:#cf6a64!important; background:rgba(142,35,24,.16)!important; color:#ff9a93!important; }
  /* Botón Tienda: carmesí quemado (--rojo) con hover en --rojo-claro + glow de fuego. */
  #exi-shop-btn{ background:linear-gradient(180deg,var(--rojo-claro),var(--rojo))!important; border-color:rgba(163,43,30,.65)!important; color:var(--texto)!important; }
  #exi-shop-btn:hover{ background:var(--rojo-claro)!important; border-color:rgba(163,43,30,.9)!important; box-shadow:0 0 12px rgba(214,109,10,.35); }
  /* Estados deshabilitados de las acciones (Repetir / ×2 / Limpiar): apagados, sin bordes brillantes. */
  .exi-act:disabled{ color:var(--texto-sec)!important; background:var(--panel-solido)!important; border-color:rgba(123,77,37,.3)!important; opacity:.7; box-shadow:none!important; }
  /* ── Iluminación dramática durante el giro: foco sobre la rueda + "despertar" del dragón central ── */
  @keyframes exiDragonGlow{ 0%,100%{ filter:drop-shadow(0 0 5px rgba(187,141,80,.35)) brightness(1); } 50%{ filter:drop-shadow(0 0 18px rgba(187,141,80,.95)) drop-shadow(0 0 34px rgba(255,90,20,.5)) brightness(1.22); } }
  .exi-spinning #exi-wheel-dragon{ animation:exiDragonGlow 1.15s ease-in-out infinite; }
  @keyframes exiCellFlash{ 0%,100%{ box-shadow:inset 0 0 0 2px var(--oro-claro), 0 0 10px rgba(187,141,80,.45); } 50%{ box-shadow:inset 0 0 0 3px var(--oro-brillo), 0 0 30px 6px rgba(227,213,183,.95), 0 0 54px 10px rgba(187,141,80,.6); } }
  .exi-cell-flash{ animation:exiCellFlash .55s ease-in-out 4; z-index:15; }
  /* ── El crupier resuelve la mesa: fichas perdedoras barridas, ganadoras con destello + pago ── */
  @keyframes exiChipSweep{ 0%{ transform:translateX(-50%) translateY(0) scale(1); opacity:1; } 100%{ transform:translateX(-50%) translateY(38px) scale(.5); opacity:0; } }
  .bet-chipstack.exi-chip-sweep{ animation:exiChipSweep .6s cubic-bezier(.4,0,1,1) forwards; }
  @keyframes exiChipPayout{ 0%,100%{ filter:drop-shadow(0 0 2px rgba(187,141,80,.4)); } 50%{ filter:drop-shadow(0 0 10px rgba(227,213,183,1)) drop-shadow(0 0 18px rgba(187,141,80,.8)); } }
  .bet-chipstack.exi-chip-payout{ animation:exiChipPayout .7s ease-in-out 3; }
  @keyframes exiChipPayoutLbl{ 0%{ transform:translate(-50%,4px); opacity:0; } 25%{ opacity:1; } 100%{ transform:translate(-50%,-16px); opacity:0; } }
  .exi-chip-payout-lbl{ animation:exiChipPayoutLbl 2.1s ease both; }
  /* "¡No va más!": el tapete se atenúa y deja de responder un instante antes del giro. */
  #exi-board.exi-board-locked{ opacity:.5; filter:grayscale(.35) brightness(.85); pointer-events:none; transition:opacity .25s ease, filter .25s ease; }
  /* ── Pestañas Historial/Estadísticas + billboard de la mesa ── */
  .exi-numtab{ flex:1 1 0; min-width:0; font-family:'Inter',sans-serif; font-weight:700; font-size:10px; letter-spacing:.02em; text-transform:uppercase; padding:5px 4px; border-radius:8px; border:1px solid rgba(187,141,80,.25); background:rgba(0,0,0,.24); color:var(--texto-sec); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; }
  /* Pestaña activa: estado de selección → pátina teal (--verdin), consistente con "en línea". */
  .exi-numtab[aria-pressed="true"]{ border-color:rgba(111,143,132,.65); background:rgba(111,143,132,.16); color:#9fc7b2; }
  .exi-stat-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; color:var(--texto-sec); }
  .exi-stat-bar{ flex:1; height:6px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden; }
  .exi-stat-bar > span{ display:block; height:100%; border-radius:4px; }
  .exi-hotcold-chip{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; font-weight:800; font-size:12px; color:var(--texto); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
  /* ── Ticker de leaderboard: en el flujo normal (arriba de la cabecera), nunca tapa nada ── */
  #exi-ticker{ position:relative; z-index:8; display:none; align-items:center; gap:8px; padding:6px 14px; border-radius:10px; background:var(--panel); backdrop-filter:blur(var(--panel-blur)); -webkit-backdrop-filter:blur(var(--panel-blur)); border:1px solid rgba(187,141,80,.28); box-shadow:0 10px 26px -14px rgba(0,0,0,.7); font-family:'Inter',sans-serif; }
  #exi-ticker-close{ flex-shrink:0; background:none; border:1px solid rgba(187,141,80,.35); color:var(--texto-sec); border-radius:6px; width:22px; height:22px; font-size:11px; line-height:1; cursor:pointer; }
  #exi-ticker-track{ flex:1; overflow:hidden; white-space:nowrap; }
  #exi-ticker-track:not(.exi-ticker-static) #exi-ticker-inner{ display:inline-flex; gap:0; animation:exiTickerScroll 30s linear infinite; }
  #exi-ticker-track:not(.exi-ticker-static):hover #exi-ticker-inner{ animation-play-state:paused; }
  @keyframes exiTickerScroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .exi-ticker-static{ overflow-x:auto; }
  .exi-ticker-static #exi-ticker-inner{ display:inline-flex; gap:22px; }
  .exi-ticker-item{ color:var(--texto); font-size:12.5px; font-weight:600; letter-spacing:.02em; }
  /* ── Fichas: tamano tapeable (>=52px) + estados hover/active/focus; el seleccionado fija su transform inline ── */
  .exi-chip{ position:relative; aspect-ratio:1; min-width:52px; border:none; background:transparent; cursor:pointer; padding:0; outline:none; transition:transform .16s ease, filter .16s ease; }
  .exi-chip:hover{ transform:translateY(-2px) scale(1.05); }
  .exi-chip:focus-visible{ outline:2px solid var(--oro-claro); outline-offset:3px; border-radius:50%; }
  /* ── Fichas con imagen: la moneda flota suavemente y el número de valor (1/5/10) pulsa en dorado ── */
  @keyframes exiChipFloat{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-3px) rotate(-4deg); } }
  .exi-chip-img{ animation:exiChipFloat 3s ease-in-out infinite; }
  @keyframes exiChipNum{ 0%,100%{ transform:translateX(-50%) scale(1); box-shadow:0 0 0 0 rgba(187,141,80,.45), 0 2px 6px rgba(0,0,0,.65); } 50%{ transform:translateX(-50%) scale(1.16); box-shadow:0 0 11px 2px rgba(187,141,80,.6), 0 2px 6px rgba(0,0,0,.65); } }
  .exi-chip-num{ position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); z-index:2; min-width:22px; height:22px; padding:0 6px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; font-weight:800; font-size:12.5px; line-height:1; color:var(--oro-brillo); background:linear-gradient(180deg,#241708,#0c0805); border:1.5px solid rgba(187,141,80,.85); text-shadow:0 1px 2px rgba(0,0,0,.9); pointer-events:none; animation:exiChipNum 3s ease-in-out infinite; }
  .exi-chip[aria-pressed="true"] .exi-chip-num{ color:#2a1608; background:linear-gradient(180deg,var(--oro-brillo),var(--oro-medio)); border-color:var(--texto)0c9; text-shadow:none; }
  /* Animación universal de TODOS los botones: hover con brillo, "press" al click, disabled atenuado */
  button{ transition:transform .12s ease, filter .15s ease, box-shadow .15s ease, background .15s ease; }
  button:not(:disabled):hover{ filter:brightness(1.13) saturate(1.06); }
  button:not(:disabled):active{ transform:scale(.94)!important; }
  button:disabled{ filter:grayscale(.35) brightness(.82); cursor:default; }
  @keyframes exiPulseBtn{ 0%,100%{ box-shadow:0 0 0 0 rgba(187,141,80,.55), 0 10px 26px -8px rgba(187,141,80,.6); } 50%{ box-shadow:0 0 0 7px rgba(187,141,80,0), 0 10px 26px -8px rgba(187,141,80,.6); } }
  #readybtn:not(:disabled){ animation:exiPulseBtn 2.1s ease-in-out infinite; }
  /* ── Título principal: brillo de casino (glow pulsante) + "Exilium" con destello dorado ── */
  @keyframes exiTitleGlow{ 0%,100%{ text-shadow:0 0 24px rgba(187,141,80,.35), 0 2px 0 rgba(0,0,0,.6); } 50%{ text-shadow:0 0 36px rgba(187,141,80,.8), 0 0 12px rgba(227,213,183,.55), 0 2px 0 rgba(0,0,0,.6); } }
  #exi-title{ animation:exiTitleGlow 2.6s ease-in-out infinite; }
  @keyframes exiShimmer{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }
  .exi-title-hl{ background:linear-gradient(90deg,var(--oro-claro) 0%,var(--oro-brillo) 25%,#f4ecdc 50%,var(--oro-brillo) 75%,var(--oro-claro) 100%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; animation:exiShimmer 3s linear infinite; }
  /* ── Logo Exilium de la cabecera: leve flotar + glow ── */
  @keyframes exiLogoPulse{ 0%,100%{ transform:translateY(0) scale(1); box-shadow:0 0 22px -6px rgba(187,141,80,.5), inset 0 1px 0 rgba(255,255,255,.06); } 50%{ transform:translateY(-2px) scale(1.04); box-shadow:0 0 32px -3px rgba(187,141,80,.85), inset 0 1px 0 rgba(255,255,255,.06); } }
  .exi-logo{ animation:exiLogoPulse 3.4s ease-in-out infinite; }
  /* Botón Sentarse: grande, llamativo, animación de casino (pulso + brillo que barre) */
  @keyframes seatPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(187,141,80,.6), 0 10px 26px -6px rgba(187,141,80,.7); } 50%{ box-shadow:0 0 0 12px rgba(187,141,80,0), 0 10px 30px -6px rgba(187,141,80,.85); } }
  @keyframes seatShine{ 0%{ transform:translateX(-160%) skewX(-18deg); } 100%{ transform:translateX(360%) skewX(-18deg); } }
  .exi-seatbtn{ position:relative; overflow:hidden; animation:seatPulse 1.7s ease-in-out infinite; }
  .exi-seatbtn::after{ content:''; position:absolute; top:0; bottom:0; left:0; width:40%; background:linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); animation:seatShine 2.4s ease-in-out infinite; pointer-events:none; }
  .exi-seatbtn:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  /* ── Placa de nombre del asiento: SIEMPRE por encima de las skins + efecto magnético al puntero ── */
  .exi-seat-plate{ transition:transform .14s ease-out, box-shadow .2s ease, border-color .2s ease; transform-style:preserve-3d; will-change:transform; }
  .exi-seat-plate:hover{ border-color:var(--oro-brillo)!important; box-shadow:0 10px 26px -6px rgba(187,141,80,.75), 0 0 0 1px rgba(217,167,90,.55)!important; }
  /* ── Decoraciones de la tienda (estilo Nitro) ── */
  .df-gold{ border-color:#f0a52e!important; animation:dfGold 1.8s ease-in-out infinite; }
  @keyframes dfGold{ 0%,100%{ box-shadow:0 0 0 2px #f0a52e,0 0 10px rgba(240,165,46,.7),0 0 22px rgba(240,165,46,.4); } 50%{ box-shadow:0 0 0 3px #ffd98a,0 0 18px rgba(255,200,90,1),0 0 36px rgba(240,165,46,.7); } }
  .df-emerald{ border-color:#54d18a!important; animation:dfEmerald 1.8s ease-in-out infinite; }
  @keyframes dfEmerald{ 0%,100%{ box-shadow:0 0 0 2px #2f9c63,0 0 10px rgba(84,209,138,.7),0 0 22px rgba(47,156,99,.4); } 50%{ box-shadow:0 0 0 3px #9fffd0,0 0 18px rgba(120,255,180,1),0 0 36px rgba(84,209,138,.7); } }
  .df-flame{ border-color:#ff6a00!important; animation:dfFlame .85s ease-in-out infinite; }
  @keyframes dfFlame{ 0%,100%{ box-shadow:0 0 0 2px #ff6a00,0 -2px 12px 2px rgba(255,60,0,.9),0 0 18px 4px rgba(255,140,0,.85),0 0 32px 8px rgba(255,80,0,.45); } 50%{ box-shadow:0 0 0 3px #ffb000,0 -3px 18px 3px rgba(255,120,0,1),0 0 26px 6px rgba(255,205,40,.95),0 0 46px 11px rgba(255,90,0,.55); } }
  .df-ice{ border-color:#7ec8ff!important; animation:dfIce 1.5s ease-in-out infinite; }
  @keyframes dfIce{ 0%,100%{ box-shadow:0 0 0 2px #7ec8ff,0 0 12px rgba(126,200,255,.8),0 0 26px rgba(126,200,255,.45); } 50%{ box-shadow:0 0 0 3px #eaf7ff,0 0 22px rgba(210,240,255,1),0 0 42px rgba(150,210,255,.7); } }
  .df-dragon{ border-color:#b51a1a!important; animation:dfDragon 1.6s ease-in-out infinite; }
  @keyframes dfDragon{ 0%,100%{ box-shadow:0 0 0 2px #b51a1a,0 0 14px 2px rgba(181,26,26,.9),0 0 30px 6px rgba(240,165,46,.5); } 50%{ box-shadow:0 0 0 4px #f0a52e,0 0 24px 5px rgba(240,165,46,1),0 0 48px 11px rgba(181,26,26,.7); } }
  .ne-gold{ background:linear-gradient(90deg,#f7c168,#fff0c0,#f0a52e); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent!important; }
  .ne-fire{ background:linear-gradient(90deg,#ff3d00,#ffb000,#ff3d00); background-size:200% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent!important; animation:neSlide 2s linear infinite; }
  .ne-rainbow{ background:linear-gradient(90deg,#ff3d3d,#ffb000,#54d18a,#3fc7eb,#8788ee,#ff3d3d); background-size:300% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent!important; animation:neSlide 3s linear infinite; }
  @keyframes neSlide{ to{ background-position:300% center; } }
  .cs-neon{ filter:drop-shadow(0 0 6px #3fc7eb) drop-shadow(0 0 3px #8788ee); }
  .cs-royal{ filter:drop-shadow(0 0 6px #b388ff) drop-shadow(0 0 3px #f0a52e); }
  /* ════════════════ RESPONSIVE (auditoría RWD) ════════════════ */
  /* Desktop ≥1280px: layout original intacto (3 columnas, stage 100vh). */
  /* El botón de colapsar chat solo aparece en móvil. */
  .exi-chat-toggle{ display:none; }
  /* Dragones flotantes DESACTIVADOS: el nuevo fondo (assets/Nuevo-fondo.png) ya trae
     dos dragones dorados ornamentales enmarcando la escena → los flotantes sobraban.
     Para reactivarlos, cambiar display:none por opacity:.9. */
  .exi-dragon-deco{ display:none; }
  .exi-dragon-deco img{ -webkit-mask-image:radial-gradient(ellipse 72% 76% at 50% 46%, #000 58%, transparent 88%); mask-image:radial-gradient(ellipse 72% 76% at 50% 46%, #000 58%, transparent 88%); }
  /* ── Tablet landscape (1024–1279px): 3 columnas más estrechas + scroll vertical de seguridad ── */
  @media (max-width:1279px){
    #exi-stage{ height:auto!important; min-height:100vh!important; overflow-y:auto!important; padding-top:8px!important; }
    #exi-arena{ grid-template-columns:minmax(166px,200px) minmax(0,1fr) minmax(166px,200px)!important; gap:8px!important; }
    /* La barra de acciones ya vive DENTRO del header (no flota) → sin reglas fixed. */
  }
  /* ── Tablet portrait (768–1023px): reordenar columnas → ruleta arriba, controles + chat debajo ── */
  @media (max-width:1023px){
    #exi-arena{ grid-template-columns:1fr 1fr!important; grid-template-areas:"center center" "right left"!important; gap:12px!important; }
    #exi-arena>:nth-child(1){ grid-area:left; min-height:0!important; }
    #exi-arena>:nth-child(2){ grid-area:center; }
    #exi-arena>:nth-child(3){ grid-area:right; align-self:stretch!important; }
    .exi-dragon-deco{ display:none!important; } /* dragones decorativos: estorban al estrechar */
    /* La ruleta agrandada (ver --exi-wheel-* en :root) se achica un poco acá: a este ancho
       ya no hay tanto aire vertical y el aro dorado empezaba a tapar los asientos de abajo. */
    :root{ --exi-wheel-scale:1.25; --exi-wheel-dy:-40px; --exi-wheel-dx:10px; }
    #exi-belowwheel{ margin-top:calc(clamp(14px,2.6vh,32px) + 30px)!important; }
    #exi-topbar{ gap:6px!important; }
    #exi-topbar .exi-hide-sm{ display:none!important; }
    #exi-topbar button{ padding:7px 11px!important; }
  }
  /* ── Móvil (<768px): vertical, ruleta centrada, chat colapsable, tablero con scroll horizontal ── */
  @media (max-width:767px){
    #exi-stage{ overflow:visible!important; padding-top:8px!important; padding-bottom:14px!important; }
    #exi-arena{ grid-template-columns:1fr!important; grid-template-areas:"center" "right" "left"!important; gap:12px!important; }
    /* Cabecera fija arriba → el SALDO PandaCoins SIEMPRE visible al hacer scroll.
       Ahora envuelve (wrap) porque también contiene las acciones (Cómo jugar/Tienda/perfil). */
    .exi-header{ position:sticky; top:0; z-index:8; flex-wrap:wrap!important; gap:8px!important; margin-bottom:8px!important; padding:6px 6px!important; background:linear-gradient(180deg,rgba(10,8,6,.97),rgba(10,8,6,.86))!important; }
    .exi-header > div:first-child{ width:42px!important; height:42px!important; }
    .exi-header > div:nth-child(2) > span:first-child{ display:none!important; } /* eyebrow "Exilium·Quel'Thalas" fuera */
    .exi-header h1{ font-size:clamp(15px,4.6vw,20px)!important; }
    #exi-saldo{ padding:6px 11px 6px 7px!important; gap:7px!important; }
    #exi-header-right{ gap:8px!important; }
    /* Tablero: scroll horizontal y celdas tapeables (≥40px de alto) */
    #exi-board{ overflow-x:auto!important; -webkit-overflow-scrolling:touch; }
    #exi-board > div{ min-width:560px!important; }
    #board-numbers{ grid-template-rows:repeat(3,minmax(40px,46px))!important; }
    /* Chat colapsable (toggle) + altura acotada cuando está abierto */
    .exi-chat-toggle{ display:inline-flex!important; }
    #exi-chat-panel #chat{ max-height:150px!important; }
    #exi-chat-panel.exi-chat-collapsed{ flex:0 0 auto!important; min-height:0!important; }
    #exi-chat-panel.exi-chat-collapsed #chat,
    #exi-chat-panel.exi-chat-collapsed .exi-chat-inputrow{ display:none!important; }
    /* A este ancho la ruleta agrandada (145% en escritorio) se salía del viewport por los
       costados (overflow-x:clip la recortaba) — achicada a un tamaño que entra cómodo. */
    :root{ --exi-wheel-scale:1.1; --exi-wheel-dy:-20px; --exi-wheel-dx:6px; }
    #exi-belowwheel{ margin-top:22px!important; gap:12px!important; }
    /* TODO (mejora futura, requiere mover el DOM o usar JS): en móvil el orden es
       ruleta → controles → historial → chat → tablero de números. Lo ideal sería
       ruleta → tablero → controles. El tablero (#exi-board) es hermano de #exi-arena
       (no hijo), por eso no se puede intercalar solo con CSS sin refactor. */
  }
  /* ── Pantallas de POCA ALTURA (monitores ultrawide, portátiles bajos, ventanas no
       maximizadas): en vez de amontonar todo para caber en 100vh, el contenido toma su
       altura natural y la página hace scroll. Junto al max-width de arriba, esto hace que
       la sala se adapte a CUALQUIER proporción de monitor. ── */
  /* El tamaño de #exi-wheel ya se liga al alto de la ventana con calc(100vh - 560px) en su
     estilo base → estas franjas solo compactan los márgenes verticales en pantallas bajas
     (los antiguos topes fijos de ancho por breakpoint sobraban y causaban scroll). */
  @media (min-width:1280px) and (max-height:1040px){
    :root{ --exi-wheel-scale:1.3; --exi-wheel-dy:-35px; }
    #exi-belowwheel{ margin-top:calc(clamp(6px,1.2vh,16px) + 35px)!important; gap:clamp(10px,2vw,32px)!important; }
    .exi-header{ margin-bottom:2px!important; }
  }
  /* Portátiles bajos (≤860px de alto): modo COMPACTO — se recorta el presupuesto vertical fijo
     (cabecera, ticker, tablero, asientos) para que la sala completa siga cabiendo sin scroll. */
  @media (min-width:1280px) and (max-height:860px){
    #exi-stage{ padding-top:4px!important; padding-bottom:4px!important; }
    /* El ticker de top apostadores ya NO se oculta acá: en monitores ultrawide (anchos
       pero de poca altura) era invisible por esta regla y es info que sí se quiere ver.
       Si la página necesita scrollear un poco de más por esto, es preferible a perderlo. */
    #exi-ticker{ margin-bottom:4px!important; }
    .exi-header{ margin-bottom:0!important; }
    .exi-logo{ width:44px!important; height:44px!important; }
    .exi-header > div:nth-child(2) > span:first-child{ display:none!important; } /* eyebrow fuera */
    #exi-title{ font-size:clamp(15px,1.5vw,20px)!important; }
    #exi-wheel{ width:clamp(250px, min(48vw, calc(100vh - 470px)), 580px)!important; }
    :root{ --exi-wheel-scale:1.2; --exi-wheel-dy:-25px; }
    #exi-belowwheel{ margin-top:24px!important; }
    #exi-chat-panel{ min-height:140px!important; }
    #board-numbers{ grid-template-rows:repeat(3,minmax(22px,26px))!important; }
    #board-dozens button{ padding:5px 4px!important; }
    #board-outside button{ padding:6px 4px!important; }
    #exi-board{ padding:5px 8px!important; }
    #exi-board > div:last-child{ margin-top:2px!important; }
  }
  /* Tooltips (data-tip): burbuja dorada sobre el control al pasar el mouse o enfocar con
     teclado. data-tip-down la muestra DEBAJO (para la barra superior, donde arriba no hay
     sitio). Solo CSS: sin JS ni librerías. */
  [data-tip]{ position:relative; }
  [data-tip]:hover::after, [data-tip]:focus-visible::after{
    content:attr(data-tip); position:absolute; bottom:calc(100% + 9px); left:50%; transform:translateX(-50%);
    background:linear-gradient(180deg,#2a1a0d,var(--panel-solido)); color:var(--texto); border:1px solid rgba(187,141,80,.45);
    border-radius:8px; padding:6px 11px; font-family:'Inter',sans-serif; font-size:11.5px; font-weight:600;
    letter-spacing:.02em; line-height:1.35; white-space:nowrap; z-index:9990; pointer-events:none;
    box-shadow:0 10px 26px rgba(0,0,0,.65); text-transform:none;
  }
  [data-tip]:hover::before, [data-tip]:focus-visible::before{
    content:''; position:absolute; bottom:calc(100% + 4px); left:50%; transform:translateX(-50%) rotate(45deg);
    width:9px; height:9px; background:var(--panel-solido); border-right:1px solid rgba(187,141,80,.45);
    border-bottom:1px solid rgba(187,141,80,.45); z-index:9991; pointer-events:none;
  }
  [data-tip][data-tip-down]:hover::after, [data-tip][data-tip-down]:focus-visible::after{ bottom:auto; top:calc(100% + 9px); }
  [data-tip][data-tip-down]:hover::before, [data-tip][data-tip-down]:focus-visible::before{ bottom:auto; top:calc(100% + 4px); transform:translateX(-50%) rotate(225deg); }
  /* Moneda del saldo: giro 3D suave con pausas — la mayor parte del ciclo muestra el anverso,
     media vuelta enseña el reverso, y vuelve. */
  @keyframes exiCoinFlip{
    0%, 52%  { transform:rotateY(0); }
    68%, 80% { transform:rotateY(180deg); }
    96%,100% { transform:rotateY(360deg); }
  }
  .exi-coinflip{ animation:exiCoinFlip 7s cubic-bezier(.45,.05,.25,1) infinite; }
  /* Accesibilidad (web-design-guidelines / impeccable): respeta a quien pide menos
     movimiento — desactiva los bucles decorativos (float, glow, pulso, halos) y deja
     las transiciones casi instantáneas. La ruleta sigue funcionando (salta al número). */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; scroll-behavior:auto!important; }
  }
  :focus-visible{ outline:2px solid var(--oro-claro); outline-offset:2px; }
  #chatinput::placeholder{ color:var(--texto-sec); opacity:1; }
</style>
</head>
<body>

<div id="exi-stage" style="position:relative; min-height:100vh; width:100%; box-sizing:border-box; background:radial-gradient(ellipse at 50% 0%, rgba(187,141,80,.10), transparent 55%), radial-gradient(ellipse at 50% 120%, rgba(142,35,24,.16), transparent 60%), url(assets/Nuevo-fondo.png) center/cover no-repeat, #140b05; font-family:'Inter',sans-serif; color:var(--texto); overflow-x:clip; overflow-y:visible; padding:8px clamp(10px,1.4vw,20px) 10px; display:flex; flex-direction:column; align-items:center; gap:0;">

  <div aria-hidden="true" style="position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(118deg, rgba(0,0,0,.13) 0 2px, transparent 2px 5px); opacity:.35; mix-blend-mode:overlay;"></div>
  <div aria-hidden="true" style="position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 140px 30px rgba(0,0,0,.4);"></div>

  <!-- Ticker "Mayores ganancias": va en el FLUJO normal (no fixed), arriba de todo lo demás,
       para que nunca tape el tapete ni ningún otro panel. -->
  <div id="exi-ticker" style="display:none; width:100%; max-width:1800px; margin:0 auto 8px;"></div>

  <!-- HEADER -->
  <header class="exi-header" style="position:relative; z-index:8; width:100%; max-width:1800px; margin-left:auto; margin-right:auto; display:flex; align-items:center; gap:14px; margin-bottom:6px; flex-shrink:0; flex-wrap:wrap;">
    <div class="exi-logo" style="width:72px; height:72px; flex-shrink:0; border-radius:16px; background:linear-gradient(150deg,#1c150f,#0c0a08); border:1.5px solid rgba(187,141,80,.4); box-shadow:0 0 22px -6px rgba(187,141,80,.5), inset 0 1px 0 rgba(255,255,255,.06); display:flex; align-items:center; justify-content:center; overflow:hidden; will-change:transform;">
      <img src="assets/logo.png" style="width:100%; height:100%; object-fit:contain; border-radius:12px;" alt="Exilium" />
    </div>
    <div style="display:flex; flex-direction:column; line-height:1.05;">
      <span style="font-size:12.5px; letter-spacing:.34em; color:var(--texto-sec); text-transform:uppercase; margin-bottom:5px; font-weight:700;">Exilium · Quel'Thalas</span>
      <h1 id="exi-title" style="font-family:'Cinzel Decorative',serif; font-weight:700; font-size:clamp(20px,2.1vw,30px); letter-spacing:.02em; color:var(--texto); text-transform:uppercase; text-shadow:0 0 24px rgba(187,141,80,.35), 0 2px 0 rgba(0,0,0,.6);">Ruleta <span class="exi-title-hl" style="color:var(--oro-claro);">Exílium</span> Guild</h1>
    </div>
    <!-- Grupo derecho UNIFICADO: acciones (Cómo jugar / Tienda / sonido / perfil) + saldo.
         La barra flotante #exi-topbar se monta dentro de #exi-actions-slot (ya no flota
         sobre el centro → la skin del avatar sentado deja de quedar cortada). -->
    <div id="exi-header-right" style="margin-left:auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end;">
      <div id="exi-actions-slot" style="display:flex; align-items:center; gap:9px; flex-wrap:wrap; justify-content:flex-end;"></div>
      <div id="exi-saldo" class="exi-panel" style="display:flex; align-items:center; gap:11px; padding:9px 18px 9px 12px; border-radius:999px; background:linear-gradient(180deg,#16110c,#0c0907); border:1.5px solid rgba(187,141,80,.42); box-shadow:0 18px 44px -16px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.05);">
        <!-- Moneda con giro 3D: anverso (coin_3) y reverso (assets/casino/reverso.png). El giro
             es un rotateY con pausas (ver @keyframes exiCoinFlip); backface-visibility oculta
             la cara que queda de espaldas. prefers-reduced-motion lo frena como al resto. -->
        <div aria-hidden="true" style="width:40px; height:40px; flex-shrink:0; perspective:150px;">
          <div class="exi-coinflip" style="position:relative; width:100%; height:100%; transform-style:preserve-3d;">
            <div style="position:absolute; inset:0; border-radius:50%; box-shadow:0 0 14px rgba(187,141,80,.4); display:flex; align-items:center; justify-content:center; overflow:hidden; backface-visibility:hidden;"><img src="assets/coin_3.png" style="width:100%; height:100%; object-fit:contain;" alt="" /></div>
            <div style="position:absolute; inset:0; border-radius:50%; box-shadow:0 0 14px rgba(187,141,80,.55); overflow:hidden; backface-visibility:hidden; transform:rotateY(180deg);"><img src="assets/casino/reverso.png" style="width:100%; height:100%; object-fit:cover;" alt="" /></div>
          </div>
        </div>
        <div style="line-height:1.1;">
          <span style="display:block; font-size:11.5px; letter-spacing:.18em; color:var(--texto); opacity:.85; text-transform:uppercase; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.8);">Tu saldo · PandaCoins</span>
          <span style="font-family:'Inter',sans-serif; font-weight:800; font-size:clamp(19px,1.8vw,26px); color:var(--texto); font-variant-numeric:tabular-nums; line-height:1.05;"><span id="bal">—</span> <span style="color:var(--oro-claro); font-size:.7em; font-weight:700;">C</span></span>
        </div>
      </div>
    </div>
  </header>

  <!-- ARENA -->
  <div id="exi-arena" style="position:relative; z-index:2; width:100%; max-width:1800px; margin-left:auto; margin-right:auto; display:grid; grid-template-columns:minmax(198px,242px) minmax(0,1fr) minmax(198px,242px); gap:clamp(8px,1vw,16px); align-items:stretch; margin-bottom:6px; flex:1 0 auto; min-height:0;">

    <!-- LEFT -->
    <div style="display:flex; flex-direction:column; gap:12px; min-height:0;">
      <section id="exi-panel-numeros" class="exi-panel" style="background:linear-gradient(180deg,rgba(22,16,12,.82),rgba(12,9,7,.82)); border:1px solid rgba(187,141,80,.2); border-radius:14px; box-shadow:0 20px 50px -22px rgba(0,0,0,.8); padding:13px 14px 14px;">
        <div style="margin-bottom:11px;">
          <h2 id="exi-t-numeros" style="display:flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; font-weight:700; font-size:15px; letter-spacing:.13em; text-transform:uppercase; color:var(--texto); margin:0 0 8px;"><span style="width:7px; height:7px; border-radius:50%; background:var(--oro-claro); box-shadow:0 0 9px var(--oro-claro); animation:exiGlow 2.4s ease-in-out infinite;"></span>Mesa</h2>
          <div id="exi-numeros-tabs" role="tablist" aria-label="Historial o estadísticas de la mesa" style="display:flex; gap:5px; width:100%;">
            <button type="button" class="exi-numtab" data-numtab="hist" aria-pressed="true" data-tip="Últimos números que han salido en la mesa">Historial</button>
            <button type="button" class="exi-numtab" data-numtab="stats" aria-pressed="false" data-tip="Números calientes, fríos y rachas de color">Estadísticas</button>
          </div>
        </div>
        <div id="history" style="display:grid; grid-template-columns:repeat(5,1fr); gap:6px;"></div>
        <div id="exi-stats" style="display:none; flex-direction:column; gap:9px;"></div>
      </section>

      <section id="exi-chat-panel" class="exi-panel" style="flex:1; min-height:240px; display:flex; flex-direction:column; background:linear-gradient(180deg,rgba(26,18,12,.9),rgba(14,9,7,.92)); border:1px solid rgba(187,141,80,.28); border-radius:14px; box-shadow:0 20px 50px -22px rgba(0,0,0,.8), inset 0 0 38px -18px rgba(187,141,80,.25); overflow:hidden;">
        <div style="display:flex; align-items:center; gap:8px; padding:12px 14px 10px; border-bottom:1px solid rgba(187,141,80,.18); background:linear-gradient(180deg,rgba(187,141,80,.1),transparent);">
          <span style="width:8px; height:8px; border-radius:50%; background:var(--verdin); box-shadow:0 0 10px var(--verdin); animation:exiGlow 2.2s ease-in-out infinite;"></span>
          <h2 id="exi-t-chat" style="font-family:'Inter',sans-serif; font-weight:700; font-size:15px; letter-spacing:.13em; text-transform:uppercase; color:var(--texto);">Chat de sala</h2>
          <span style="margin-left:auto; font-size:11.5px; color:var(--verdin); letter-spacing:.05em; font-weight:600;"><span id="online">0</span> en línea</span>
          <button type="button" class="exi-chat-toggle" aria-label="Mostrar u ocultar el chat" onclick="var p=document.getElementById('exi-chat-panel');var c=p.classList.toggle('exi-chat-collapsed');this.firstChild.textContent=c?'Mostrar ▾':'Ocultar ▴';" style="align-items:center; margin-left:8px; background:rgba(187,141,80,.12); border:1px solid rgba(187,141,80,.4); color:var(--oro-claro); border-radius:7px; padding:4px 9px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap;"><span>Ocultar ▴</span></button>
        </div>
        <div id="chat" class="exi-scroll" role="log" aria-label="Mensajes del chat de la sala" style="flex:1; min-height:0; overflow-y:auto; padding:8px 10px; display:flex; flex-direction:column; gap:6px;"></div>
        <div class="exi-chat-inputrow" style="display:flex; gap:7px; padding:10px 12px; border-top:1px solid rgba(187,141,80,.18);">
          <input id="chatinput" type="text" maxlength="160" placeholder="Escribe a la guild…" aria-label="Mensaje para el chat de la sala" style="flex:1; min-width:0; background:rgba(0,0,0,.4); border:1px solid rgba(187,141,80,.22); border-radius:8px; padding:9px 11px; color:var(--texto); font-family:'Inter',sans-serif; font-size:13.5px; outline:none;">
          <button id="chatsend" type="button" class="exi-btn-primary" style="flex-shrink:0; padding:9px 16px; font-size:13.5px;">Enviar</button>
        </div>
      </section>
    </div>

    <!-- CENTER -->
    <section style="position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:0; overflow:visible;">
      <div class="exi-dragon-deco" aria-hidden="true" style="position:absolute; top:50%; right:calc(50% + min(15vw,200px)); width:clamp(130px,15vw,210px); z-index:1; pointer-events:none; animation:exiFloat 5s ease-in-out infinite; filter:drop-shadow(0 0 22px rgba(142,35,24,.5)) drop-shadow(0 10px 18px rgba(0,0,0,.45)) saturate(1.05) brightness(.96);">
        <img src="assets/pandadragon.png" style="width:100%; aspect-ratio:1; object-fit:contain;" alt="" />
      </div>
      <div class="exi-dragon-deco" aria-hidden="true" style="position:absolute; top:50%; left:calc(50% + min(15vw,200px)); width:clamp(130px,15vw,210px); z-index:1; pointer-events:none; animation:exiFloatR 5s ease-in-out infinite; animation-delay:-2.5s; filter:drop-shadow(0 0 22px rgba(142,35,24,.5)) drop-shadow(0 10px 18px rgba(0,0,0,.45)) saturate(1.05) brightness(.96);">
        <img src="assets/pandadragon.png" style="width:100%; aspect-ratio:1; object-fit:contain; transform:scaleX(-1);" alt="" />
      </div>

      <!-- Tamaño ligado al ALTO real de la ventana (100vh menos el presupuesto fijo de cabecera +
           asientos + tablero ≈ 560px): la sala entera cabe en pantalla SIN scroll en escritorio,
           en monitores grandes la ruleta llega a 580px y en ventanas bajas se encoge sola. -->
      <div id="exi-wheel" style="position:relative; width:clamp(300px, min(52vw, calc(100vh - 560px)), 580px); aspect-ratio:1/1; min-width:220px; display:flex; align-items:center; justify-content:center; transform:translate(var(--exi-wheel-dx),var(--exi-wheel-dy)) scale(var(--exi-wheel-scale));">
        <!-- Bolita: gira en sentido CONTRARIO a la rueda (como en una mesa real) y rebota antes

  if(_ws){ try{ _ws.onopen=_ws.onmessage=_ws.onclose=_ws.onerror=null; _ws.close(); }catch(e){} _ws=null; }
  let sock; try{ sock=new WebSocket(wsUrl()); }catch(e){ scheduleReconnect(); return; }
  _ws=sock;
  sock.onopen=()=>{ _wsBackoff=1000; if(window.EXIDBG) EXIDBG.event('ws','conectado'); };
  sock.onmessage=(ev)=>{ if(_ws!==sock) return; let d; try{ d=JSON.parse(ev.data); }catch(e){ return; } onWsMessage(d); };
  sock.onclose=()=>{ if(_ws!==sock) return; if(window.EXIDBG) EXIDBG.event('ws','cerrado · reconectando…'); scheduleReconnect(); };
  sock.onerror=()=>{ if(_ws!==sock) return; if(window.EXIDBG) EXIDBG.log('warn','ws','error de socket'); try{ sock.close(); }catch(e){} };
}
function scheduleReconnect(){ clearTimeout(_wsReconnect); if(document.hidden) return; _wsReconnect=setTimeout(connectWS, _wsBackoff); _wsBackoff=Math.min(_wsBackoff*1.6, 10000); }
function reconnectWS(){ try{ if(_ws) _ws.close(); }catch(e){} _ws=null; connectWS(); }
function onWsMessage(d){

  else if(d.type==='shop'){ S.shop={ catalog:d.catalog||[], owned:d.owned||[], equipped:d.equipped||{} };
    // Guardar el equipado + imágenes resueltas en localStorage para que "Mi Perfil" lo muestre
    // AL INSTANTE (evita el lag de la caché de KV, que tarda hasta ~60s en refrescar /me).
    try{ var eq=S.shop.equipped||{}, im={};
      Object.keys(eq).forEach(function(slot){ var id=eq[slot]; var it=(S.shop.catalog||[]).find(function(x){return x&&x.id===id;}); var url=(it&&it.image)||DECO_IMAGE[id]||null; if(url) im[slot]=url; });

// ── Placa de nombre "magnética": al pasar el ratón, la placa se inclina/desplaza
// hacia el puntero (efecto 3D que parece seguir el cursor). Delegado en #seats
// porque los asientos se re-renderizan en cada estado. ──────────────────────
(function initSeatMagnet(){
  const seats=document.getElementById('seats'); if(!seats) return;
  function clampN(v,m){ return Math.max(-m,Math.min(m,v)); }
  seats.addEventListener('mousemove', e=>{
    const col=e.target.closest('[data-seat-col]');
    const active=col?col.querySelector('.exi-seat-plate'):null;
    seats.querySelectorAll('.exi-seat-plate').forEach(p=>{ if(p!==active) p.style.transform=''; });
    if(!active) return;
    const r=active.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const dx=e.clientX-cx, dy=e.clientY-cy;
    const tx=clampN(dx*0.13,9), ty=clampN(dy*0.13,7);
    const ry=clampN(dx*0.11,11), rx=clampN(-dy*0.11,9);
    active.style.transform='translate('+tx.toFixed(1)+'px,'+ty.toFixed(1)+'px) perspective(380px) rotateX('+rx.toFixed(1)+'deg) rotateY('+ry.toFixed(1)+'deg) scale(1.07)';
  });
  seats.addEventListener('mouseleave', ()=>{ seats.querySelectorAll('.exi-seat-plate').forEach(p=>p.style.transform=''); });
})();

function renderTicker(list){
  if(_tickerHideSession) return;
  const o=ensureTicker(); if(!o) return;
  const items=list.slice(0,10).map((u,i)=>'🏆 '+(i+1)+'. '+esc(u.name)+' — '+fmt(u.total_won)+' C ganados');
  const reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const track=o.querySelector('#exi-ticker-track'), inner=o.querySelector('#exi-ticker-inner');
  if(reduced){
    track.classList.add('exi-ticker-static');
    inner.innerHTML=items.map(t=>'<span class="exi-ticker-item">'+t+'</span>').join('');
    o.style.display='flex';
    return;
  }
  track.classList.remove('exi-ticker-static');
  const base=items.join('&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;')+'&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;';
  // Si el contenido no cambió, NO re-renderizar: reiniciaba la animación cada 60s y el
  // recorrido nunca se completaba (se veía "congelado" al principio una y otra vez).
  if(inner.getAttribute('data-txt')===base){ o.style.display='flex'; return; }
  inner.setAttribute('data-txt', base);
  o.style.display='flex';
  // El bucle desplaza el 50% del contenido: cada mitad debe ser MÁS ANCHA que la barra o el
  // marquee "no recorre nada" con pocos ganadores. Se mide y se repite lo necesario.
  const probe=document.createElement('span'); probe.className='exi-ticker-item';
  probe.style.cssText='visibility:hidden; position:absolute; white-space:nowrap;';
  probe.innerHTML=base; track.appendChild(probe);
  const baseW=Math.max(50, probe.offsetWidth), trackW=Math.max(200, track.offsetWidth);
  track.removeChild(probe);
  const reps=Math.max(1, Math.ceil(trackW/baseW));
  const half='<span class="exi-ticker-item">'+Array(reps+1).join(base)+'</span>';
  inner.innerHTML=half+half;
  // Velocidad constante (~70 px/s) independientemente de cuánto contenido haya.
  inner.style.animationDuration=Math.max(14, Math.round(baseW*reps/70))+'s';
}

function placeBet(key){
  if(!token()){ flash('Entra con Discord para apostar.'); return; }
  if(S.status!=='betting'){ flash('Solo puedes apostar en la fase de apuestas.'); return; }
  if(!S.mySeat){ flash('Siéntate primero (botón bajo la ruleta).'); return; }
  if(S.mySeat.ready){ flash('Ya marcaste LISTO. Limpia para cambiar tu apuesta.'); return; }
  const {min_bet,max_bet,max_bets_per_round}=S.cfg;
  const merged=mergedBets(); const pending={...S.pendingBets};
  const newAmt=(merged[key]||0)+S.chip;
  if(newAmt>max_bet){ flash('Máximo '+max_bet+' por apuesta.'); return; }
  const distinct=new Set(Object.keys(merged)); distinct.add(key);
  if(distinct.size>max_bets_per_round){ flash('Máximo '+max_bets_per_round+' apuestas por ronda.'); return; }
  const totalPending=Object.values(pending).reduce((a,b)=>a+b,0)+S.chip;
  if(S.balance!=null && totalPending>S.balance){ flash('No tienes PandaCoins suficientes.'); return; }
  pending[key]=(pending[key]||0)+S.chip; S.pendingBets=pending; S.result=null;

// Anima una ficha "volando" desde el panel de fichas hasta la casilla apostada (Web Animations API).
function throwChipAnimation(key){
  try{
    const src=document.querySelector('#chips [data-chip="'+S.chip+'"]');
    const dst=document.querySelector('[data-bet-key="'+key+'"]');
    if(!src||!dst||typeof dst.animate!=='function') return;
    const r0=src.getBoundingClientRect(), r1=dst.getBoundingClientRect();
    if(!r0.width||!r1.width) return;
    const size=Math.max(16,Math.min(30,r0.width*0.65));
    const img=document.createElement('img');
    img.src=CHIP_IMG[S.chip]||CHIP_IMG[1]; img.alt='';
    img.style.cssText='position:fixed; left:0; top:0; width:'+size+'px; height:'+size+'px; object-fit:contain; z-index:9400; pointer-events:none; border-radius:50%; filter:drop-shadow(0 4px 8px rgba(0,0,0,.6));';
    const x0=r0.left+r0.width/2-size/2, y0=r0.top+r0.height/2-size/2;
    const x1=r1.left+r1.width/2-size/2, y1=r1.top+r1.height/2-size/2;
    const xm=(x0+x1)/2, ym=Math.min(y0,y1)-50;
    document.body.appendChild(img);
    const anim=img.animate([
      { transform:'translate('+x0+'px,'+y0+'px) scale(1)', offset:0 },
      { transform:'translate('+xm+'px,'+ym+'px) scale(1.15)', offset:.5 },
      { transform:'translate('+x1+'px,'+y1+'px) scale(.8)', opacity:1, offset:1 },
    ], { duration:300, easing:'cubic-bezier(.25,.65,.3,1)' });
    anim.onfinish=()=>{ img.remove(); };
    anim.oncancel=()=>{ img.remove(); };
  }catch(e){}
}

function animateWheel(idx){ if(window.EXIDBG) EXIDBG.event('rueda','girar → índice '+idx+' (n='+EURO[idx]+'), fase='+S.status);
  _wheelSettled=false; render(); // oculta el cartel mientras gira
  if(window.EXISFX && EXISFX.spinLoop) EXISFX.spinLoop(); // audio: baja volumen+velocidad al desacelerar
  const stage=$('exi-stage'); if(stage) stage.classList.add('exi-spinning'); // foco dramático + ojos del dragón
  if(S.use3D && window.Wheel3D){
    // Respaldo: en un dispositivo real jamás debería tardar tanto, pero si algo se atasca
    // (pestaña que estuvo en 2º plano, render muy lento) igual se revela el resultado.
    let done3d=false; const finish3d=()=>{ if(done3d) return; done3d=true; onWheelSettled(); };
    window.Wheel3D.spin(idx, finish3d);
    setTimeout(finish3d, 8000);
    return;
  }
  // Ruleta plana (respaldo sin WebGL): llevar el sector idx ARRIBA (donde se posa la bola CSS).
  const step=360/37; const cur=S.wheelDeg; const base=cur-(cur%360);
  S.wheelDeg=base+360*6+((360-idx*step+WHEEL_IMG_OFFSET_DEG)%360);
  const el=$('wheel-rot'); if(el) el.style.transform='rotate('+S.wheelDeg+'deg)';
  ballAnimate();
  let done=false; const finish=()=>{ if(done) return; done=true; onWheelSettled(); };
  if(el) el.addEventListener('transitionend', finish, { once:true });
  setTimeout(finish, 4300); // respaldo por si transitionend no dispara
}
// La bola: gira en sentido CONTRARIO a la rueda y se pasa un poco antes de fijarse (rebote),
// terminando exactamente en el mismo "arriba" donde queda el número ganador.
let _ballAnim=null;
function ballAnimate(){
  const track=$('exi-wheel-ball-track'), ball=$('exi-wheel-ball'); if(!track||!ball||typeof track.animate!=='function') return;
  ball.style.display='block';
  // La bola es un punto FIJO que ya arranca "arriba" (12 en punto) en la pista sin rotar: para que
  // vuelva a quedar arriba (mismo punto de referencia donde la rueda deja el número ganador), el
  // giro final debe ser un múltiplo exacto de 360°. El signo negativo = sentido CONTRARIO a la rueda.
  const finalAngle=-(360*6);
  const kf=[
    { transform:'rotate(0deg)' },
    { transform:'rotate('+(finalAngle*0.5).toFixed(2)+'deg)', offset:0.42 },
    { transform:'rotate('+(finalAngle*0.82).toFixed(2)+'deg)', offset:0.66 },
    { transform:'rotate('+(finalAngle-16).toFixed(2)+'deg)', offset:0.80 },
    { transform:'rotate('+(finalAngle+8).toFixed(2)+'deg)', offset:0.88 },
    { transform:'rotate('+(finalAngle-4).toFixed(2)+'deg)', offset:0.94 },
    { transform:'rotate('+(finalAngle+1.5).toFixed(2)+'deg)', offset:0.98 },
    { transform:'rotate('+finalAngle.toFixed(2)+'deg)' },
  ];
  try{ if(_ballAnim) _ballAnim.cancel(); _ballAnim=track.animate(kf, { duration:4300, easing:'cubic-bezier(.1,.35,.15,1)', fill:'forwards' }); }catch(e){}
}

function chipBreakdown(amount){
  const denoms=[10,5,1]; const stack=[]; let rem=Math.max(0,Math.round(amount));
  for(const d of denoms){ while(rem>=d && stack.length<7){ stack.push(d); rem-=d; } }
  return stack;
}
// Multiplicador de pago por tipo de apuesta (mismo criterio que la tabla de pagos del modal
// "Cómo jugar"): pleno 35:1, docena/columna 2:1, resto (color/paridad/mitad) 1:1.
function payoutMultiplier(key){
  const t=key.split(':')[0];
  if(t==='number') return 35;
  if(t==='dozen'||t==='col') return 2;
  return 1;
}
// ¿Esta apuesta acierta con el número ganador n? (misma cobertura que affected(), en sentido inverso).
function betWins(key,n){
  const [t,v]=key.split(':');
  if(t==='number') return Number(v)===n;
  if(n===0) return false; // el 0 solo lo cubre "number:0"
  if(key==='red') return RED.has(n);
  if(key==='black') return !RED.has(n);
  if(key==='even') return n%2===0;
  if(key==='odd') return n%2===1;
  if(key==='low') return n<=18;
  if(key==='high') return n>=19;
  if(t==='dozen') return Math.ceil(n/12)===Number(v);
  if(t==='col') return (n%3===0?3:n%3)===Number(v);
  return false;
}
// Etiqueta de pago legible para el tooltip de cada casilla ("Pleno · paga 35:1").
function payoutLabel(key){
  const m=payoutMultiplier(key);
  return labelFor(key)+' · paga '+m+':1';
}

// ── Panel de estadísticas de mesa (el "billboard" LED de una ruleta real) ──
// Todo se calcula sobre S.history, que ya llega por WS (hasta HISTORY_MAX rondas del DO).
function renderStatsPanel(){
  const box=$('exi-stats'); if(!box) return;
  const hist=S.history||[];
  if(!hist.length){ box.innerHTML='<div style="color:var(--texto-sec); font-size:12px; text-align:center; padding:10px 0;">Aún no hay rondas jugadas en esta mesa.</div>'; return; }
  const freq={};
  let reds=0, blacks=0, greens=0, evens=0, odds=0;
  let sinceZero=hist.length;
  for(let i=0;i<hist.length;i++){
    const n=hist[i]; freq[n]=(freq[n]||0)+1;
    const c=colorOf(n); if(c==='red') reds++; else if(c==='black') blacks++; else greens++;
    if(n!==0){ if(n%2===0) evens++; else odds++; }
    if(n===0 && sinceZero===hist.length) sinceZero=i;
  }
  if(!hist.includes(0)) sinceZero=hist.length;
  const uniq=Object.keys(freq).map(Number);
  const byFreqDesc=[...uniq].sort((a,b)=>freq[b]-freq[a]||a-b);
  const byFreqAsc=[...uniq].sort((a,b)=>freq[a]-freq[b]||a-b);
  const hot=byFreqDesc.slice(0,3), cold=byFreqAsc.slice(0,3);
  const nonZero=Math.max(1, evens+odds);
  const pct=(v,t)=>Math.round((v/Math.max(1,t))*100);
  const chipHtml=n=>'<span class="exi-hotcold-chip" style="background:'+numBg(n)+';">'+n+'</span>';
  box.innerHTML=
    '<div style="font-size:10.5px; color:var(--texto-sec); letter-spacing:.04em;">De las últimas '+hist.length+' rondas</div>'+
    '<div class="exi-stat-row"><span>🔥 Calientes</span><span style="display:flex; gap:5px;">'+hot.map(chipHtml).join('')+'</span></div>'+
    '<div class="exi-stat-row"><span>❄️ Fríos</span><span style="display:flex; gap:5px;">'+cold.map(chipHtml).join('')+'</span></div>'+
    '<div class="exi-stat-row"><span style="width:64px; flex-shrink:0;">Rojo·Negro</span><span class="exi-stat-bar"><span style="width:'+pct(reds,reds+blacks+greens)+'%; background:var(--rojo); float:left;"></span><span style="width:'+pct(blacks,reds+blacks+greens)+'%; background:#2a2420; float:left;"></span></span><span style="width:74px; text-align:right; font-variant-numeric:tabular-nums;">'+pct(reds,reds+blacks+greens)+'%·'+pct(blacks,reds+blacks+greens)+'%</span></div>'+
    '<div class="exi-stat-row"><span style="width:64px; flex-shrink:0;">Par·Impar</span><span class="exi-stat-bar"><span style="width:'+pct(evens,nonZero)+'%; background:var(--oro-claro); float:left;"></span><span style="width:'+pct(odds,nonZero)+'%; background:var(--oro-sombra); float:left;"></span></span><span style="width:74px; text-align:right; font-variant-numeric:tabular-nums;">'+pct(evens,nonZero)+'%·'+pct(odds,nonZero)+'%</span></div>'+
    '<div class="exi-stat-row"><span>Rondas sin 0</span><strong style="color:var(--texto);">'+sinceZero+'</strong></div>';
}

    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineJoin='round'; ctx.miterLimit=2;
    ctx.strokeStyle='rgba(0,0,0,0.95)'; ctx.lineWidth=20; ctx.strokeText(String(num),128,140);
    ctx.fillStyle='#ffffff'; ctx.fillText(String(num),128,140);
    const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;
    // Filtrado anisotrópico: los números se miran en ángulo muy oblicuo (cámara baja) — sin esto
    // el mipmapping los emborrona aunque la textura sea grande.
    t.anisotropy=renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  // Entorno equirectangular NEGRO/BORDÓ (era rosa/marrón "Monte Carlo"): candelabros dorados tenues,
  // fondo casi negro para que el rojo/negro de las cuñas no se laven hacia tonos pastel.
  function envTexture(){
    const c=document.createElement('canvas'); c.width=256; c.height=128;
    const ctx=c.getContext('2d');
    const g=ctx.createLinearGradient(0,0,0,128);
    g.addColorStop(0,'#160506'); g.addColorStop(0.45,'#060202'); g.addColorStop(1,'#000000');
    ctx.fillStyle=g; ctx.fillRect(0,0,256,128);
    for(let i=0;i<7;i++){
      const x=(i/7)*256+18, y=rand(14,42), r=rand(9,20);
      const bg=ctx.createRadialGradient(x,y,0,x,y,r);
      bg.addColorStop(0,'rgba(255,214,150,0.4)'); bg.addColorStop(1,'rgba(255,160,70,0)');
      ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    const t=new THREE.CanvasTexture(c); t.mapping=THREE.EquirectangularReflectionMapping;
    return t;
  }

  const renderer=new THREE.WebGLRenderer({ canvas:canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  // El tone-mapping ACES filmic (el que traía el prototipo) es justo lo que lavaba el rojo/negro
  // de las cuñas a rosa/gris SIN IMPORTAR el material (hasta MeshBasicMaterial, sin luz, se veía
  // afectado) — es una curva de post-proceso sobre TODO el frame. Sin tone-mapping, los colores de
  // las cuñas (y del resto) se ven fieles a como se definieron, igual que en el tapete plano.
  renderer.toneMapping=THREE.NoToneMapping;
  renderer.toneMappingExposure=1;

  const scene=new THREE.Scene();
  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromEquirectangular(envTexture()).texture;

  const camera=new THREE.PerspectiveCamera(38,1,0.1,60);
  // Cámara más cerca que el prototipo (0,4.35,4.9): la rueda llena el encuadre en vez de verse
  // pequeña — pero no tanto como para que el bowl se corte contra los bordes del canvas.
  const CAM_BASE=new THREE.Vector3(0,3.78,4.28);
  camera.position.copy(CAM_BASE); camera.lookAt(0,0.05,0);

  // Luces "salón Exilium": ambiental oscura neutra (ya no morada), foco cálido, relleno dorado
  // (encaja con el gold #f0a52e de la mesa) y un relleno rojo tenue en vez del azul frío.
  scene.add(new THREE.AmbientLight(srgb(0x1a0f08), 0.5));
  const spot=new THREE.SpotLight(srgb(0xffe0bd), 1.1, 0, 0.55, 0.55, 1);
  spot.position.set(0.6,7.5,2.6); spot.castShadow=true; spot.shadow.mapSize.set(2048,2048); spot.shadow.bias=-0.0006;
  scene.add(spot);
  const goldFill=new THREE.PointLight(srgb(0xd8a04a),0.45,0,2); goldFill.position.set(-3.4,2.2,-2.2); scene.add(goldFill);
  const redFill=new THREE.PointLight(srgb(0x8a2020),0.22,0,2); redFill.position.set(3.2,1.6,3.2); scene.add(redFill);

  // Materiales: oro/cromo se mantienen (ya encajan); la "madera" pasa de marrón claro a laca
  // negra/bordó oscura; los paños rojo/negro/verde son la semántica REAL de la ruleta (no cambian).
  // TODOS los colores pasan por srgb() — sin eso, el bug de gamma doble los lavaba a rosa/gris.
  const MAT_GOLD=new THREE.MeshStandardMaterial({ color:srgb(0xd8b25c), metalness:0.92, roughness:0.24 });
  const MAT_CHROME=new THREE.MeshStandardMaterial({ color:srgb(0xf0f2f5), metalness:1.0, roughness:0.12 });
  const MAT_WOOD=new THREE.MeshStandardMaterial({ map:woodTexture('#3a1210','#1c0808','#0a0303'), roughness:0.6, metalness:0.05, envMapIntensity:0.5 });
  const MAT_WOOD_D=new THREE.MeshStandardMaterial({ map:woodTexture('#220a0a','#120505','#050202'), roughness:0.65, metalness:0.03, envMapIntensity:0.45 });
  // Mismos colores EXACTOS que el tapete (numBg() en el script principal: rojo #b51a1a, negro
  // #26211d, verde #2f9c63), pasados por srgb() para que se vean IGUAL de vivos que en el tapete.
  const POCKET_MATS={
    red:   new THREE.MeshStandardMaterial({ color:srgb(0xb51a1a), roughness:0.55, metalness:0.05, envMapIntensity:0.25 }),
    black: new THREE.MeshStandardMaterial({ color:srgb(0x26211d), roughness:0.55, metalness:0.08, envMapIntensity:0.25 }),
    green: new THREE.MeshStandardMaterial({ color:srgb(0x2f9c63), roughness:0.55, metalness:0.05, envMapIntensity:0.25 })
  };

  // Radio contenido: con la cámara cercana, un receptor más grande proyectaba una sombra que el
  // borde del canvas cortaba en línea recta (efecto "plataforma cortada").
  const shadowCatcher=new THREE.Mesh(new THREE.CircleGeometry(2.15,48), new THREE.ShadowMaterial({ opacity:0.3 }));
  shadowCatcher.rotation.x=-Math.PI/2; shadowCatcher.position.y=-0.16; shadowCatcher.receiveShadow=true; scene.add(shadowCatcher);

  // (El plinto/plataforma gris del prototipo se eliminó: con la cámara más cerca quedaba cortado
  //  por el borde del canvas y se veía como una franja gris rota bajo la rueda.)

  // Perfil con el borde exterior RECORTADO respecto al prototipo (2.13 → 1.94): con la cámara
  // cercana, el radio original desbordaba el frustum y el bowl aparecía cortado en rectángulo.
  const profile=[
    new THREE.Vector2(1.55,0.00), new THREE.Vector2(1.60,0.13), new THREE.Vector2(1.68,0.225),
    new THREE.Vector2(1.78,0.30), new THREE.Vector2(1.86,0.335), new THREE.Vector2(1.92,0.29),
    new THREE.Vector2(1.94,0.12), new THREE.Vector2(1.88,0.00)
  ];
  // Bowl en ORO cepillado (no laca negra): mantiene el marco dorado de la mesa sin el plano-arte.
  const MAT_GOLD_BOWL=new THREE.MeshStandardMaterial({ color:srgb(0xc09a45), metalness:0.85, roughness:0.34 });
  const bowl=new THREE.Mesh(new THREE.LatheGeometry(profile,96), MAT_GOLD_BOWL);
  bowl.material.side=THREE.DoubleSide; bowl.castShadow=true; bowl.receiveShadow=true; scene.add(bowl);

  const lip=new THREE.Mesh(new THREE.TorusGeometry(1.86,0.022,12,96), MAT_GOLD);
  lip.rotation.x=Math.PI/2; lip.position.y=0.34; scene.add(lip);

  // (El plano con ruleta-aro-exterior.png se quitó: un PNG plano tumbado sobre un bowl 3D con
  //  perspectiva se veía como una calcomanía. El aro dorado real es el bowl + labio de arriba.)
  const texLoader=new THREE.TextureLoader();

  for(let d=0;d<8;d++){
    const a=(d/8)*Math.PI*2;
    const dia=new THREE.Mesh(new THREE.OctahedronGeometry(0.045), MAT_CHROME);
    dia.position.set(Math.sin(a)*1.72,0.245,Math.cos(a)*1.72); dia.scale.set(1,0.65,1); dia.castShadow=true; scene.add(dia);
  }

  const wheelGroup=new THREE.Group(); scene.add(wheelGroup);
  const POCKET_R_OUT=1.5, POCKET_R_BALL=1.27, POCKET_TOP_Y=0.10;

  const headBase=new THREE.Mesh(new THREE.CylinderGeometry(1.52,1.5,0.07,74), MAT_WOOD_D);
  headBase.position.y=0.02; headBase.receiveShadow=true; wheelGroup.add(headBase);

  for(let i=0;i<N;i++){
    const num=EU_SEQ[i];
    const wedge=new THREE.Mesh(
      new THREE.CylinderGeometry(POCKET_R_OUT,POCKET_R_OUT,0.05,6,1,false, i*SECTOR-SECTOR/2, SECTOR),
      POCKET_MATS[numColor(num)]
    );
    wedge.position.y=POCKET_TOP_Y-0.025; wedge.receiveShadow=true; wheelGroup.add(wedge);
  }

  const finGeo=new THREE.BoxGeometry(0.016,0.062,0.5);
  for(let i=0;i<N;i++){
    const a=i*SECTOR+SECTOR/2;
    const fin=new THREE.Mesh(finGeo, MAT_GOLD);
    fin.position.set(Math.sin(a)*1.25, POCKET_TOP_Y+0.03, Math.cos(a)*1.25); fin.rotation.y=a; fin.castShadow=true; wheelGroup.add(fin);
  }

  const numPlaneGeo=new THREE.PlaneGeometry(0.195,0.195);
  for(let i=0;i<N;i++){
    const pivot=new THREE.Group(); pivot.rotation.y=i*SECTOR;
    const plane=new THREE.Mesh(numPlaneGeo, new THREE.MeshBasicMaterial({ map:numberTexture(EU_SEQ[i]), transparent:true }));
    plane.position.set(0,POCKET_TOP_Y+0.004,1.335); plane.rotation.set(-Math.PI/2,0,Math.PI);
    pivot.add(plane); wheelGroup.add(pivot);
  }

  const headWall=new THREE.Mesh(new THREE.CylinderGeometry(1.53,1.53,0.14,74,1,true), MAT_GOLD);
  headWall.position.y=0.075; wheelGroup.add(headWall);

  // Centro: MEDALLÓN DEL DRAGÓN (assets/ruleta/asientos.png, dragón dorado del editor), como en
  // la versión plana. Disco con el arte, DENTRO de wheelGroup → gira pegado a los números. Recorte
  // cuadrado centrado por repeat/offset para no deformar el arte (por si el PNG no es cuadrado).
  const dragonTex=texLoader.load('assets/ruleta/asientos.png', function(t){
    t.encoding=THREE.sRGBEncoding; t.anisotropy=renderer.capabilities.getMaxAnisotropy();
    const iw=t.image.width, ih=t.image.height;
    if(iw>ih){ t.repeat.set(ih/iw,1); t.offset.x=(1-ih/iw)/2; }
    else if(ih>iw){ t.repeat.set(1,iw/ih); t.offset.y=(1-iw/ih)/2; }
  });
  const dragonDisc=new THREE.Mesh(
    new THREE.CircleGeometry(0.985,64),
    new THREE.MeshBasicMaterial({ map:dragonTex })
  );
  dragonDisc.rotation.x=-Math.PI/2; dragonDisc.position.y=POCKET_TOP_Y+0.012; wheelGroup.add(dragonDisc);

  const coneRing=new THREE.Mesh(new THREE.TorusGeometry(1.0,0.016,10,72), MAT_GOLD);
  coneRing.rotation.x=Math.PI/2; coneRing.position.y=POCKET_TOP_Y+0.01; wheelGroup.add(coneRing);

  const spindle=new THREE.Mesh(new THREE.CylinderGeometry(0.032,0.045,0.2,20), MAT_CHROME);
  spindle.position.y=POCKET_TOP_Y+0.32; wheelGroup.add(spindle);

  const turret=new THREE.Mesh(new THREE.SphereGeometry(0.085,24,24), MAT_CHROME);
  turret.position.y=POCKET_TOP_Y+0.44; turret.castShadow=true; wheelGroup.add(turret);

  const handleGeo=new THREE.CylinderGeometry(0.018,0.018,0.56,12);
  const knobGeo=new THREE.SphereGeometry(0.032,14,14);
  for(let h=0;h<2;h++){
    const handle=new THREE.Mesh(handleGeo, MAT_GOLD);
    handle.rotation.z=Math.PI/2; handle.rotation.y=h*Math.PI/2; handle.position.y=POCKET_TOP_Y+0.40; wheelGroup.add(handle);
    for(let k=-1;k<=1;k+=2){
      const knob=new THREE.Mesh(knobGeo, MAT_GOLD);
      const ang=h*Math.PI/2;
      knob.position.set(Math.cos(ang)*0.28*k, POCKET_TOP_Y+0.40, -Math.sin(ang)*0.28*k); wheelGroup.add(knob);
    }
  }

  const ball=new THREE.Mesh(new THREE.SphereGeometry(0.048,24,24), new THREE.MeshStandardMaterial({ color:srgb(0xfdfcf8), roughness:0.18, metalness:0.05 }));
  ball.castShadow=true; ball.visible=false; scene.add(ball);

  // ── Máquina de estados de la física de la bola — MISMAS fases que el prototipo, pero comprimidas
  // a ~4s en total (antes ~7.65s) para encajar con spinning_duration del servidor (4s) sin tocar el backend. ──
  const WHEEL_IDLE=0.22, WHEEL_FAST=2.7;
  const BALL_FAST=-4.9;
  const TRACK_R=1.68, TRACK_Y=0.29;
  const T_ACCEL=0.55, T_FAST=0.75, T_DECEL=2.3, T_SETTLE=0.4, T_DELAY=150; // ms el último

  let wheelRot=0, wheelOmega=WHEEL_IDLE;
  let ballAngle=0, ballR=TRACK_R, ballY=TRACK_Y;
  let phase='idle', spinStart=0;
  let winIdx=0, onSettled=null;
  let wheelRot0=0, ballAngle0=0, spinDelta=0, startR=TRACK_R, startY=TRACK_Y;
  const T1=T_ACCEL, T2=T_ACCEL+T_FAST, T3=T_ACCEL+T_FAST+T_DECEL;
  // GSAP por defecto "perdona" frames lentos alargando los tweens (lagSmoothing): aquí eso
  // estiraría el rebote final en equipos flojos → tiempo estricto.
  try{ if(gsap.ticker && gsap.ticker.lagSmoothing) gsap.ticker.lagSmoothing(0); }catch(_){}

  // ── Trayectorias DETERMINISTAS en forma cerrada ─────────────────────────────
  // Nada se integra frame a frame durante el giro: rueda y bola son funciones exactas del tiempo
  // (integral analítica de los perfiles de velocidad). Así: (1) da igual que el equipo vaya a
  // 10 FPS — cada frame pinta la posición correcta de ese instante, sin deriva acumulada; y
  // (2) el ángulo INICIAL de la bola se resuelve para que su recorrido termine EXACTAMENTE en el
  // casillero ganador → la bola desacelera, baja la pendiente, rebota y CAE en el número, sin
  // ningún ajuste/teletransporte de última hora.
  //   ω rueda: sube IDLE→FAST (t<T1), crucero FAST (t<T2), baja con ease 1-u³ hasta IDLE (t<T3).
  //   ω bola:  0→BALL_FAST, crucero, y frena con el mismo ease escalado (0.92·u³).
  const AW1=WHEEL_IDLE*T1+(WHEEL_FAST-WHEEL_IDLE)*T1/2;
  const AW2=AW1+WHEEL_FAST*T_FAST;
  const AW3=AW2+T_DECEL*(WHEEL_FAST-(WHEEL_FAST-WHEEL_IDLE)/4);
  const AB1=BALL_FAST*T1/2;
  const AB2=AB1+BALL_FAST*T_FAST;
  const AB3=AB2+T_DECEL*BALL_FAST*(1-0.92/4);
  function wheelTravel(e){
    if(e<=0) return 0;
    if(e<T1) return WHEEL_IDLE*e+(WHEEL_FAST-WHEEL_IDLE)*e*e/(2*T1);
    if(e<T2) return AW1+WHEEL_FAST*(e-T1);
    if(e<T3){ const u=(e-T2)/T_DECEL; return AW2+T_DECEL*(WHEEL_FAST*u-(WHEEL_FAST-WHEEL_IDLE)*u*u*u*u/4); }
    return AW3;
  }
  function ballTravel(e){
    if(e<=0) return 0;
    if(e<T1) return BALL_FAST*e*e/(2*T1);
    if(e<T2) return AB1+BALL_FAST*(e-T1);
    if(e<T3){ const u=(e-T2)/T_DECEL; return AB2+T_DECEL*BALL_FAST*(u-0.92*u*u*u*u/4); }
    return AB3;
  }

  // ── Rebotes de suspenso ──────────────────────────────────────────────────
  // En el último tramo del frenado (u>BOUNCE_U0) la bola ya está sobre el anillo de casilleros
  // y da 4 botes parabólicos de altura decreciente (duración ∝ √altura, como un rebote real)
  // mientras los casilleros pasan por debajo. Es parte de la MISMA forma cerrada: la altura es
  // función exacta de u, así que el último bote termina justo cuando el ángulo relativo clava
  // el casillero ganador — suspenso sin desincronizar nada.
  // Alturas ~4/2.5/1.3/0.6 radios de bola: con la cámara a ~5.7 unidades, menos que esto
  // no se percibe (la primera versión usaba 0.085 máx y los botes se "sentían" pero no se veían).
  const BOUNCE_U0=0.52;
  const BOUNCE_H=[0.19,0.11,0.06,0.03];
  const BOUNCE_SEG=(function(){
    const d=BOUNCE_H.map(function(h){ return Math.sqrt(h); });
    const tot=d.reduce(function(a,b){ return a+b; },0);
    let acc=0;
    return BOUNCE_H.map(function(h,i){ const s={ h:h, a:acc, len:d[i]/tot }; acc+=d[i]/tot; return s; });
  })();
  function bounceY(q){ // q∈[0,1] dentro de la ventana de botes → altura extra sobre la base
    if(q<=0||q>=1) return 0;
    for(let i=0;i<BOUNCE_SEG.length;i++){ const s=BOUNCE_SEG[i];
      if(q<s.a+s.len){ const p=(q-s.a)/s.len; return s.h*4*p*(1-p); } }
    return 0;
  }

  function spin(idx, doneCb){
    winIdx=idx; onSettled=doneCb;
    if(ball.parent!==scene) scene.attach(ball);
    // Resolver el ángulo inicial de la bola: al final del frenado (T3) debe cumplirse
    // ballAngle(T3) = wheelRot(T3) + winIdx·SECTOR. Todo lo demás es consecuencia.
    wheelRot0=wheelRot;
    const targetWorld=wheelRot0+AW3+winIdx*SECTOR;
    const raw=targetWorld-AB3;
    // Arranque visual: si quedó aparcada de la ronda anterior, desde SU casillero actual
    // (sin salto en el primer frame); si no, desde el lado opuesto de la mesa.
    const near = ball.visible ? Math.atan2(ball.position.x, ball.position.z) : wheelRot0+Math.PI;
    const k=Math.round((near-raw)/(Math.PI*2));
    ballAngle0=raw+k*Math.PI*2;
    // El recorrido total AB3 es fijo, así que arranque y llegada exactos solo pueden diferir en
    // vueltas enteras; el resto (≤180°) se reparte suavizado en los ~4s del giro → invisible.
    spinDelta=near-ballAngle0;
    // Si venía aparcada de la ronda anterior sale desde el casillero; si no, ya en la pista.
    startR = ball.visible ? POCKET_R_BALL : TRACK_R;
    startY = ball.visible ? 0.168 : TRACK_Y;
    ball.visible=true; phase='run'; spinStart=performance.now();
  }
  function settleBall(){
    if(phase!=='run') return;
    phase='settle';
    // Fijar el estado FINAL exacto de la línea de tiempo (elimina el error del último frame).
    wheelRot=wheelRot0+AW3; wheelGroup.rotation.y=wheelRot; wheelOmega=WHEEL_IDLE;
    const theta=winIdx*SECTOR;
    wheelGroup.attach(ball);
    ball.position.set(Math.sin(theta)*POCKET_R_BALL, Math.max(ball.position.y,0.17), Math.cos(theta)*POCKET_R_BALL);
    // Solo queda posarse: micro-rebote VERTICAL (la bola ya está sobre el casillero correcto).
    gsap.to(ball.position, {
      y:0.168, duration:T_SETTLE, ease:'bounce.out',
      onComplete:function(){
        phase='parked';
        if(onSettled){ setTimeout(onSettled, T_DELAY); onSettled=null; }
      }
    });
  }

  const clock=new THREE.Clock();
  let mouseX=0, mouseY=0;
  window.addEventListener('pointermove', function(e){ mouseX=(e.clientX/window.innerWidth)*2-1; mouseY=(e.clientY/window.innerHeight)*2-1; });

  let rafId=null;
  function frame(){
    rafId=requestAnimationFrame(frame);
    const dt=Math.min(clock.getDelta(), 0.1);

    if(phase==='run'){
      const e=(performance.now()-spinStart)/1000;
      if(e>=T3){
        settleBall();
      } else {
        // Posición EXACTA para este instante (forma cerrada, sin acumulación por frame).
        wheelRot=wheelRot0+wheelTravel(e);
        const sd=e/T3, corr=spinDelta*(1-sd*sd*(3-2*sd)); // δ de arranque → 0 en T3, suavizado
        ballAngle=ballAngle0+corr+ballTravel(e);
        if(e<T1){ // sale del casillero/pista y sube a la pista de vuelo
          const s=e/T1, ss=s*s*(3-2*s);
          ballR=startR+(TRACK_R-startR)*ss;
          ballY=startY+(TRACK_Y-startY)*ss;
        } else if(e<T2){ // crucero
          ballR=TRACK_R; ballY=TRACK_Y;
        } else { // frenado: espiral hacia dentro y, al llegar al anillo, 4 botes de suspenso
          const u=(e-T2)/T_DECEL;
          if(u<BOUNCE_U0){ // descenso en espiral desde la pista hasta el borde de los casilleros
            const v=u/BOUNCE_U0;
            ballR=TRACK_R-(TRACK_R-POCKET_R_BALL-0.015)*(v*v);
            ballY=TRACK_Y-(TRACK_Y-0.185)*(v*v);
          } else { // botes parabólicos decrecientes sobre los casilleros que pasan por debajo
            const q=(u-BOUNCE_U0)/(1-BOUNCE_U0);
            ballR=POCKET_R_BALL+0.015*(1-q);
            ballY=0.185-(0.185-0.175)*q+bounceY(q);
          }
        }
        wheelGroup.rotation.y=wheelRot;
        ball.position.set(Math.sin(ballAngle)*ballR, ballY, Math.cos(ballAngle)*ballR);
      }
    }
    if(phase!=='run'){ // reposo / asentándose / aparcada: giro ambiental suave
      wheelOmega += (WHEEL_IDLE-wheelOmega)*Math.min(1, dt*1.5);
      wheelRot += wheelOmega*dt;
      wheelGroup.rotation.y = wheelRot;
    }

    if(!reducedMotion){
      camera.position.x += (CAM_BASE.x + mouseX*0.28 - camera.position.x)*0.04;
      camera.position.y += (CAM_BASE.y - mouseY*0.16 - camera.position.y)*0.04;
      camera.lookAt(0,0.05,0);
    }
    renderer.render(scene, camera);
  }

  function resize(){
    const w=wrap.clientWidth, h=wrap.clientHeight; if(!w||!h) return;
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  // ResizeObserver además del evento resize: el wrap arranca con display:none (init() lo muestra
  // después, tras el chequeo de mantenimiento). Sin esto, el primer resize() corría con 0×0, el
  // canvas se quedaba en su búfer por defecto (300×150) y el CSS lo estiraba → ruleta borrosa.
  // Reajuste diferido al siguiente frame: llamar resize() dentro del propio callback del
  // observer dispara avisos "ResizeObserver loop completed with undelivered notifications".
  if(typeof ResizeObserver!=='undefined'){
    let roPending=false;
    new ResizeObserver(function(){ if(roPending) return; roPending=true; requestAnimationFrame(function(){ roPending=false; resize(); }); }).observe(wrap);
  }
  resize(); requestAnimationFrame(resize);

  // A diferencia del prototipo (loop infinito siempre), se pausa con la pestaña en segundo plano
